<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina Formulario</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Identificação do jogador</h1>
    </header>

    <div id="opcoes" style="display: none;">
        <!--Desativa por padrão o menu de opções impedindo que ele apareça mesmo se não tiver jogador salvo-->
        <p id="mensagem"></p>
        <button id="continuar">Continuar com Usuário</button>
        <button id="novo">Criar novo jogador</button>
    </div>

    <main>
        <form id="form-jogador" novalidate>

            <label for="nome">Nome</label>
            <input type="text" required id="nome" placeholder="Nome ou apelido" maxlength="20">

            <button type="submit" id="btn-entrar">Jogar</button>
        </form>

        <p id="erro-nome" role="alert"></p>
    </main>

    <script src="js/scripts.js"></script>
</body>

</html>
